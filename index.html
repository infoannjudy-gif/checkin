<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลงเวลาครู">
<title>ลงเวลาครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ===== ตั้งค่า: วาง URL ของ Apps Script ในบรรทัด API_URL ช่วงท้ายไฟล์ ===== */
:root{
  --bg:#f3f5f1;--surface:#fff;--sunk:#e8ece5;--line:#d5dbd1;--ink:#17241d;--muted:#5d6b62;
  --accent:#1e6b55;--accent-ink:#fff;--accent-soft:#dcebe4;
  --ok:#1e7a4f;--ok-soft:#ddf1e5;--late:#a3620f;--late-soft:#fbecd3;--bad:#a8392f;--bad-soft:#f7e0dc;
  --leave:#27508a;--leave-soft:#dde8f6;
  --display:"Mitr","Sarabun",system-ui,sans-serif;--body:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111814;--surface:#18221c;--sunk:#0d130f;--line:#2b3830;--ink:#e6eee8;--muted:#97a69c;
  --accent:#5fc4a1;--accent-ink:#0c1a14;--accent-soft:#1d3a2f;
  --ok:#6fd39c;--ok-soft:#173526;--late:#f0b45e;--late-soft:#3a2a12;--bad:#f08a7e;--bad-soft:#3c1d19;
  --leave:#8db8f0;--leave-soft:#16273d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
.app.wide{max-width:1000px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.top .school{font-family:var(--display);font-size:17px}
.top .acts{display:flex;gap:14px;align-items:center}
.link{background:none;border:0;padding:6px 0;color:var(--accent);cursor:pointer;font-weight:600;font-size:14px}
.lang{border:1px solid var(--accent);border-radius:999px;padding:3px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-family:var(--display);font-weight:500;font-size:22px;padding:20px;border-radius:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:15px}
.note{background:var(--leave-soft);color:var(--leave);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.note.soft{background:var(--sunk);color:var(--muted)}
.clock{text-align:center;padding:8px 0}
.clock .t{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{color:var(--muted);margin-top:6px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.slot .l{font-size:14px;color:var(--muted)}
.slot .v{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-late{background:var(--late-soft);color:var(--late)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-none{background:var(--sunk);color:var(--muted)}
.p-leave{background:var(--leave-soft);color:var(--leave)}
/* camera */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .oval{position:absolute;inset:12% 18% 18%;border:3px dashed rgba(255,255,255,.75);border-radius:50%;pointer-events:none}
.cam .gps{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:center}
.cam .gps span{background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:999px;font-size:14px;text-align:center}
.cam .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:24px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--accent);background:var(--surface);cursor:pointer;margin:0 auto;display:block}
.shutter:disabled{opacity:.4;cursor:not-allowed}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .mark{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center}
.done .t{font-family:var(--mono);font-size:44px;font-weight:600}
.done img{width:140px;border-radius:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* leave */
textarea{resize:vertical;min-height:84px}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:16px}
.chk input{width:22px;height:22px;flex:none}
.ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
.bal{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.bal b.warn{color:var(--late)}.bal b.bad{color:var(--bad)}
.lv{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lv:first-child{border-top:0;padding-top:0}
/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:600}
.stat .l{font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.scrim .box{background:var(--surface);border-radius:14px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.scrim img{width:100%;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.lv.sel{background:var(--accent-soft);border-radius:10px;padding:10px;margin:0 -10px}
</style>
</head>
<body>

<!-- ===== หน้าเข้าสู่ระบบ / Sign in ===== -->
<main class="app" id="vLogin" hidden>
  <div class="top"><span class="school" data-school data-i="app.title">ลงเวลาครู</span><button class="link lang" data-lang type="button"></button></div>
  <div>
    <h1 style="font-size:28px" data-i="login.h"></h1>
    <p class="muted" style="margin:4px 0 0" data-i="login.sub"></p>
  </div>
  <form class="card" id="loginForm">
    <label for="inCode"><span data-i="login.code"></span><input type="text" id="inCode" autocomplete="username" autocapitalize="characters" data-ph="login.codePh" required></label>
    <label for="inPin"><span data-i="login.pin"></span><input type="password" id="inPin" inputmode="numeric" autocomplete="current-password" data-ph="login.pinPh" required></label>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn primary big" id="loginBtn" type="submit" data-i="login.btn"></button>
  </form>
  <button class="link" data-go-admin data-i="login.admin"></button>
  <button class="link" data-go-sys data-i="login.sys"></button>
</main>

<!-- ===== หน้าหลัก / Home ===== -->
<main class="app" id="vHome" hidden>
  <div class="top"><span class="school" data-school></span><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="logoutBtn" data-i="home.logout"></button></div></div>
  <div>
    <div class="muted small" data-i="home.hello"></div>
    <h1 style="font-size:26px" id="tName"></h1>
  </div>
  <div class="note" id="leaveNote" hidden></div>
  <div class="note soft" id="offNote" hidden></div>
  <div class="note" id="pinNote" hidden></div>
  <div class="note" id="swapNote" hidden></div>
  <div class="card" id="balHome" hidden></div>
  <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="clkD"></div></div>
  <div class="slots">
    <div class="slot"><div class="l" data-i="home.in"></div><div class="v" id="sIn">—</div><div id="sInSt"></div></div>
    <div class="slot"><div class="l" data-i="home.out"></div><div class="v" id="sOut">—</div><div id="sOutSt"></div></div>
  </div>
  <div class="err" id="homeErr" hidden></div>
  <button class="btn primary big" id="punchBtn"></button>
  <button class="btn" id="leaveBtn" data-i="home.leave"></button>
  <button class="btn" id="dutyBtn" data-i="duty.btn"></button>
  <button class="link" id="pinBtn" data-i="home.pin"></button>
  <p class="muted small" style="margin:0;text-align:center" id="rule"></p>
</main>

<!-- ===== หน้าถ่ายรูป / Camera ===== -->
<main class="app" id="vCam" hidden>
  <div class="top"><h2 style="font-size:20px" id="camTitle"></h2><button class="link" id="camCancel" data-i="cam.cancel"></button></div>
  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <img id="filePreview" alt="" hidden>
    <div class="oval" id="oval"></div>
    <div class="gps"><span id="gpsTxt"></span></div>
    <div class="msg" id="camMsg" hidden>
      <div id="camMsgTxt"></div>
      <button class="btn primary" id="fileBtn" type="button" data-i="cam.openBtn"></button>
    </div>
  </div>
  <input type="file" id="fileIn" accept="image/*" capture="user" hidden>
  <div class="err" id="camErr" hidden></div>
  <button class="shutter" id="shutter" data-aria="cam.shutter" disabled></button>
  <p class="muted small" style="text-align:center;margin:0" id="camHint"></p>
</main>

<!-- ===== กำลังบันทึก / สำเร็จ / Saving & done ===== -->
<main class="app" id="vDone" hidden>
  <div class="top"><span class="school" data-school></span></div>
  <div class="done" id="saving"><div class="spin"></div><div id="savingTxt"></div></div>
  <div class="done" id="saved" hidden>
    <div class="mark"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2 id="dTitle"></h2>
    <div class="t" id="dTime"></div>
    <div id="dStatus"></div>
    <div class="muted small" id="dDist"></div>
    <img id="dImg" alt="">
    <div class="note" id="dLeave" hidden style="width:100%;text-align:left;display:flex;flex-direction:column;gap:10px">
      <div id="dLeaveTxt"></div>
      <div class="row" id="dLeaveBtns"><button class="btn primary" id="dLeaveCancel" type="button" data-i="lvq.cancel"></button><button class="btn" id="dLeaveKeep" type="button" data-i="lvq.keep"></button></div>
    </div>
    <button class="btn primary" id="doneBtn" style="margin-top:8px;width:100%" data-i="save.ok"></button>
  </div>
  <div id="saveFail" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="err" id="saveErr"></div>
    <button class="btn primary" id="retryBtn" data-i="save.retry"></button>
    <button class="btn" id="failBack" data-i="save.back"></button>
  </div>
</main>

<!-- ===== ยื่นใบลา / Leave request ===== -->
<main class="app" id="vLeave" hidden>
  <div class="top"><h2 style="font-size:20px" data-i="leave.title"></h2><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="leaveBack" data-i="leave.back"></button></div></div>
  <div class="card" id="balLeave" hidden></div>
  <form class="card" id="leaveForm">
    <label for="lvKind"><span data-i="leave.kind"></span>
      <select id="lvKind">
        <option value="sick" data-i="kind.sick"></option>
        <option value="personal" data-i="kind.personal"></option>
        <option value="maternity" data-i="kind.maternity"></option>
        <option value="ordination" data-i="kind.ordination"></option>
        <option value="offsite" data-i="kind.offsite"></option>
      </select>
    </label>
    <p class="note" id="lvOffNote" hidden data-i="leave.offsiteNote"></p>
    <label for="lvPlace" id="lvPlaceWrap" hidden><span data-i="leave.place"></span><input type="text" id="lvPlace" maxlength="200"></label>
    <label for="lvFrom"><span data-i="leave.from"></span><input type="date" id="lvFrom" required></label>
    <label for="lvTo"><span data-i="leave.to"></span><input type="date" id="lvTo" required></label>
    <label class="chk" for="lvAll"><input type="checkbox" id="lvAll" checked><span data-i="leave.allDay"></span></label>
    <div class="row" id="lvTimes" hidden>
      <label for="lvFt" style="flex:1 1 130px"><span data-i="leave.ft"></span><input type="time" id="lvFt" value="08:00"></label>
      <label for="lvTt" style="flex:1 1 130px"><span data-i="leave.tt"></span><input type="time" id="lvTt" value="17:00"></label>
    </div>
    <label for="lvReason"><span id="lvReasonLbl" data-i="leave.reason"></span><textarea id="lvReason" maxlength="300"></textarea></label>
    <div class="err" id="lvErr" hidden></div>
    <div class="ok" id="lvOk" hidden></div>
    <button class="btn primary big" id="lvBtn" type="submit" data-i="leave.submit"></button>
  </form>
  <div class="card"><h3 style="font-size:18px" data-i="leave.mine"></h3><div id="lvList"></div></div>
</main>

<!-- ===== แลกเวร / Swap duty ===== -->
<main class="app" id="vDuty" hidden>
  <div class="top"><h2 style="font-size:20px" data-i="duty.title"></h2><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="dutyBack" data-i="leave.back"></button></div></div>
  <div class="ok" id="dyOk" hidden></div>
  <div class="err" id="dyLoadErr" hidden></div>
  <div class="card"><h3 style="font-size:18px" data-i="duty.mine"></h3><p class="muted small" style="margin:0" data-i="duty.pickHint"></p><div id="dyMine"></div></div>
  <form class="card" id="dutyForm" hidden>
    <h3 style="font-size:18px" data-i="duty.formH"></h3>
    <div class="note soft" id="dyPicked"></div>
    <label for="dyMode"><span data-i="duty.mode"></span>
      <select id="dyMode"><option value="swap" data-i="duty.modeSwap"></option><option value="cover" data-i="duty.modeCover"></option></select>
    </label>
    <label for="dyPartner"><span data-i="duty.partner"></span><select id="dyPartner"></select></label>
    <label for="dyTheir" id="dyTheirWrap"><span data-i="duty.their"></span><select id="dyTheir"></select></label>
    <div class="note" id="dySum" hidden></div>
    <div class="err" id="dyErr" hidden></div>
    <button class="btn primary big" id="dyBtn" type="submit" data-i="duty.submit"></button>
    <button class="btn" id="dyCancel" type="button" data-i="duty.cancelPick"></button>
  </form>
  <div class="card"><h3 style="font-size:18px" data-i="duty.history"></h3><div id="dyHist"></div></div>
  <p class="muted small" style="margin:0" data-i="duty.note"></p>
</main>

<!-- ===== เปลี่ยน PIN / Change PIN ===== -->
<main class="app" id="vPin" hidden>
  <div class="top"><h2 style="font-size:20px" data-i="pin.title"></h2><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="pinBack" data-i="leave.back"></button></div></div>
  <form class="card" id="pinForm">
    <label for="pnCur"><span data-i="pin.cur"></span><input type="password" id="pnCur" inputmode="numeric" autocomplete="current-password" required></label>
    <label for="pnNew"><span data-i="pin.new"></span><input type="password" id="pnNew" inputmode="numeric" autocomplete="new-password" required></label>
    <label for="pnConf"><span data-i="pin.confirm"></span><input type="password" id="pnConf" inputmode="numeric" autocomplete="new-password" required></label>
    <div class="err" id="pnErr" hidden></div>
    <div class="ok" id="pnOk" hidden></div>
    <button class="btn primary big" id="pnBtn" type="submit" data-i="pin.submit"></button>
  </form>
</main>

<!-- ===== Admin ระบบ / System admin ===== -->
<main class="app wide" id="vSys" hidden>
  <div class="top"><span class="school" data-i="sys.title"></span><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="sysBack" data-i="admin.back"></button></div></div>
  <form class="card" id="sysForm">
    <h2 style="font-size:20px" data-i="sys.title"></h2>
    <div class="row">
      <label for="sysCode" style="flex:1 1 160px"><span data-i="sys.code"></span><input type="password" id="sysCode" inputmode="numeric" autocomplete="current-password" required></label>
      <label for="sysDate" style="flex:1 1 160px"><span data-i="sys.week"></span><input type="date" id="sysDate"></label>
    </div>
    <div class="row">
      <button class="btn primary" type="submit" id="sysGo" data-i="sys.report"></button>
      <button class="btn" type="button" id="sysLockedBtn" data-i="sys.locked"></button>
    </div>
    <div class="err" id="sysErr" hidden></div>
  </form>
  <div id="sysOut"></div>
</main>

<!-- ===== ผู้บริหาร / Admin ===== -->
<main class="app wide" id="vAdmin" hidden>
  <div class="top"><span class="school" data-school data-i="admin.title"></span><div class="acts"><button class="link lang" data-lang type="button"></button><button class="link" id="adminBack" data-i="admin.back"></button></div></div>
  <form class="card" id="adminForm">
    <h2 style="font-size:20px" data-i="admin.title"></h2>
    <div class="row">
      <label for="adPin" style="flex:1 1 160px"><span data-i="admin.pin"></span><input type="password" id="adPin" inputmode="numeric" autocomplete="current-password" required></label>
      <label for="adDate" style="flex:1 1 160px"><span data-i="admin.date"></span><input type="date" id="adDate"></label>
      <button class="btn primary" type="submit" id="adGo" data-i="admin.go"></button>
    </div>
    <div class="row">
      <label for="adYr" style="flex:1 1 160px"><span data-i="year.pick"></span><input type="number" id="adYr" inputmode="numeric" min="2000" max="2700" data-ph="year.ph"></label>
      <button class="btn" type="button" id="adYear" data-i="year.btn"></button>
    </div>
    <div class="row">
      <label for="rgMonth" style="flex:1 1 140px"><span data-i="range.month"></span><input type="month" id="rgMonth"></label>
      <label for="rgFrom" style="flex:1 1 140px"><span data-i="range.from"></span><input type="date" id="rgFrom"></label>
      <label for="rgTo" style="flex:1 1 140px"><span data-i="range.to"></span><input type="date" id="rgTo"></label>
      <button class="btn" type="button" id="adRange" data-i="range.btn"></button>
    </div>
    <div class="err" id="adErr" hidden></div>
  </form>
  <div id="adOut"></div>
</main>

<div id="modal"></div>

<script>
/* ============================================================
   ตั้งค่า: วาง Web app URL ที่ได้จาก Apps Script ระหว่างเครื่องหมายคำพูด
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxgHoxiAdFdmc4FaOtTHidj2oqgRmgG4ez45HUHy3mQTqIxZAB0uhCr_whXzpBbmQaL/exec';

(function () {
'use strict';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {

};

async function api(action, data, timeoutMs) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)) throw new Error(t('err.url'));
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, lang: L }, data)), signal: ctrl.signal, redirect: 'follow' });
  } catch (e) {
    const ne = new Error(e.name === 'AbortError' ? t('err.timeout') : t('err.net')); ne.network = true; throw ne;
  } finally { clearTimeout(timer); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(t('err.bad')); }
  if (!j.ok) throw new Error(j.error || t('err.generic'));
  return j;
}

/* ---------- สถานะ (เก็บในชีตเป็นภาษาไทย แปลตอนแสดงผล) ---------- */
const TAG = '\\((Sick Leave|Personal Leave|Maternity Leave|Ordination Leave|Other Leave|Absent)\\)';
function trStatus(s) {
  s = String(s || '');
  const m = s.match(new RegExp(TAG));
  if (m) {
    const rest = s.slice(s.indexOf(')') + 1).trim();
    return L === 'en' ? m[1] + (rest ? ' ' + rest : '') : s.replace(new RegExp('\\s*' + TAG), '');
  }
  if (L === 'th') return s;
  return s.replace('ปรับช่วงทดลองระบบ', 'adjusted (trial period)').replace('ออกก่อนเวลา', 'Left early').replace('ปกติ', 'Normal').replace('สาย', 'Late')
    .replace('ไม่มีเวลาเข้า', 'No check-in').replace('นอกรัศมี', 'Outside radius');
}
const leaveLabel = l => (L === 'en' ? l.en : l.th) + (l.time ? ' ' + l.time : '');
const offLabel = o => L === 'en' ? o.en : o.th;
function pillFor(status) {
  if (!status) return '';
  const cls = /ขาดงาน|นอกรัศมี|ไม่มีเวลาเข้า/.test(status) ? 'p-bad' : /^ลา/.test(status) ? 'p-leave' : /สาย|ก่อนเวลา/.test(status) ? 'p-late' : 'p-ok';
  return `<span class="pill ${cls}">${esc(trStatus(status))}</span>`;
}

/* ---------- GPS ---------- */
function distM(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const dText = m => m >= 1000 ? (m / 1000).toFixed(1) + ' ' + t('unit.km') : Math.round(m) + ' ' + t('unit.m');
function startGps() {
  S.pos = null;
  if (!('geolocation' in navigator)) { gpsMsg(t('gps.none'), true); return; }
  S.watch = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    if (!S.pos || c.accuracy <= S.pos.acc || Date.now() - S.pos.at > 10000) S.pos = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, at: Date.now() };
    updateGps();
  }, e => {
    gpsMsg(e.code === 1 ? t('gps.denied') : t('gps.fail'), true);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function stopGps() { if (S.watch != null) navigator.geolocation.clearWatch(S.watch); S.watch = null; }
function gpsMsg(txt, bad) { $('#gpsTxt').textContent = txt; if (bad) err($('#camErr'), txt); updateShutter(); }
function gpsState() {
  const st = S.settings || {};
  if (!S.pos) return { ready: false };
  if (st.lat == null) return { ready: true, text: t('gps.got', Math.round(S.pos.acc)) };
  const d = distM(S.pos.lat, S.pos.lng, st.lat, st.lng), inside = d <= st.radius;
  return { ready: inside || st.allowOutside, inside, d, text: t(inside ? 'gps.in' : 'gps.out') + t('gps.dist', dText(d), Math.round(S.pos.acc)) };
}
function updateGps() {
  const g = gpsState();
  if (!g.text) { $('#gpsTxt').textContent = t('cam.finding'); return; }
  $('#gpsTxt').textContent = g.text;
  if (g.inside === false && !(S.settings || {}).allowOutside) err($('#camErr'), t('gps.needIn', S.settings.radius));
  else if (S.pos.acc > 150) err($('#camErr'), t('gps.weak', Math.round(S.pos.acc)));
  else err($('#camErr'));
  updateShutter();
}

/* ครอปเป็นแนวตั้ง 3:4 กว้าง 480px พร้อมประทับเวลา ชื่อ และระยะห่าง */
function frame(src, sw, sh, mirror) {
  const W = 480, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const r = W / H; let cw = sw, ch = sw / r; if (ch > sh) { ch = sh; cw = sh * r; }
  x.save(); if (mirror) { x.translate(W, 0); x.scale(-1, 1); }
  x.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, W, H); x.restore();
  const n = new Date(), g = gpsState();
  const l1 = `${S.teacher ? S.teacher.name : ''} · ${t(S.mode === 'in' ? 'stamp.in' : 'stamp.out')}`;
  const l2 = `${n.toLocaleDateString(locale())} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}` + (g.d != null ? ` · ${t('stamp.away', dText(g.d))}` : '');
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, H - 64, W, 64);
  x.fillStyle = '#fff'; x.font = '600 20px Sarabun, sans-serif'; x.fillText(l1, 14, H - 38);
  x.font = '16px Sarabun, sans-serif'; x.fillText(l2, 14, H - 14);
  return c.toDataURL('image/jpeg', 0.72);
}

  const came = rows.filter(r => r.in), late = came.filter(r => /สาย/.test(r.in.status));
  const leave = rows.filter(r => r.state === 'leave'), absent = rows.filter(r => r.state === 'absent'), pending = rows.filter(r => r.state === 'pending');
  const outside = rows.filter(r => (r.in && !r.in.inside) || (r.out && !r.out.inside));
  const d = new Date(j.date + 'T00:00:00').toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const stat = (l, n, sub) => `<div class="stat"><div class="l">${esc(l)}</div><div class="n">${n}</div>${sub ? `<div class="muted small">${esc(sub)}</div>` : ''}</div>`;
  $('#adOut').innerHTML = `
  ${alertsHtml(j.alerts || [])}
  ${approvalsHtml(j.pending || [])}
  ${j.leaveWarn ? `<div class="err" style="margin-bottom:10px">${esc(t('admin.leaveWarn') + j.leaveWarn)}</div>` : ''}
  <p class="muted" style="margin:0 0 10px">${esc(t('admin.sub', d, j.late, j.absentAfter))}</p>
  <div class="stats">
    ${stat(t('admin.present'), came.length, t('admin.of', rows.length))}
    ${stat(t('admin.lateN'), late.length)}
    ${stat(t('admin.leaveN'), leave.length)}
    ${stat(t('admin.absentN'), absent.length)}
    ${stat(t('admin.pendingN'), pending.length)}
    ${stat(t('admin.outsideN'), outside.length)}
  </div>
  <div class="tbl" style="margin-top:12px"><table>
    <thead><tr><th>${esc(t('admin.code'))}</th><th>${esc(t('admin.name'))}</th><th>${esc(t('admin.in'))}</th><th>${esc(t('admin.status'))}</th><th>${esc(t('admin.dist'))}</th><th>${esc(t('admin.out'))}</th><th>${esc(t('admin.status'))}</th><th>${esc(t('admin.dist'))}</th></tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td>${inCells(r)}${slotCell(r.out)}</tr>`).join('') : `<tr><td colspan="8" class="muted">${esc(t('admin.empty'))}</td></tr>`}</tbody>
  </table></div>`;
}
$('#adOut').addEventListener('click', async e => {
  const b = e.target.closest('[data-photo]'); if (!b) return;
  const m = $('#modal');
  m.innerHTML = `<div class="scrim" id="scrim"><div class="box"><div class="done"><div class="spin"></div><div>${esc(t('modal.loading'))}</div></div><button class="btn" id="mClose">${esc(t('modal.close'))}</button></div></div>`;
  const close = () => { m.innerHTML = ''; };
  $('#mClose').onclick = close; $('#scrim').onclick = ev => { if (ev.target.id === 'scrim') close(); };
  try {
    const j = await api('adminPhoto', { pin: adminPin, id: b.dataset.photo }, 60000);
    if ($('#scrim')) $('#scrim .box').innerHTML = `<img src="${j.data}" alt="${esc(t('admin.photoAlt'))}"><button class="btn" id="mClose">${esc(t('modal.close'))}</button>`;
  } catch (x) {
    if ($('#scrim')) $('#scrim .box').innerHTML = `<div class="err">${esc(x.message)}</div><button class="btn" id="mClose">${esc(t('modal.close'))}</button>`;
  }
  const c = $('#mClose'); if (c) c.onclick = close;
});

/* ---------- เริ่มต้น ---------- */
function route() {
  if (location.hash === '#admin') { show('vAdmin'); $('#adPin').focus(); return; }
  if (location.hash === '#sysadmin') { show('vSys'); $('#sysCode').focus(); return; }
  if (!S.creds) { show('vLogin'); return; }
  const cache = store.get('tc-cache');
  if (cache) { S.teacher = cache.teacher; S.settings = cache.settings; setSchool(cache.school); $('#tName').textContent = cache.teacher.name; renderHome(); }
  show('vHome');
  api('login', S.creds, 60000).then(j => { applyLogin(j); err($('#homeErr')); })
    .catch(x => {
      if (/PIN|รหัสครู|ปิดการใช้งาน|ล็อก|teacher ID|disabled|locked/i.test(x.message)) { store.del('tc-creds'); S.creds = null; show('vLogin'); err($('#loginErr'), x.message); }
      else err($('#homeErr'), x.message);
    });
}
/* ปลุกเซิร์ฟเวอร์ทันทีที่เปิดแอป เพื่อให้คำขอจริงตอบเร็วขึ้น */
function warmUp() { if (/^https:\/\/script\.google\.com\//.test(API_URL)) fetch(API_URL + '?warm=1').catch(() => {}); }
warmUp();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  warmUp();
  if (S.creds && (newDay() || Date.now() - (S.loadedAt || 0) > 10 * 60000)) refreshHome();
});
window.addEventListener('hashchange', route);
const c0 = store.get('tc-cache'); if (c0) setSchool(c0.school);
applyLang();
route();
})();
</script>
</body>
</html>
